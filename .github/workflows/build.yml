name: build-apk
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk earwax.apk
      - uses: actions/upload-artifact@v4
        with:
          name: earwax-apk
          path: earwax.apk
          retention-days: 30
      - name: Attach APK to the release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: earwax.apk
