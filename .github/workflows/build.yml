name: build-apk
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compute release version & decode signing keystore
        id: meta
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${RELEASE_TAG#v}"
          else
            RELEASE_TAG="v4.6.${GITHUB_RUN_NUMBER}"
            VERSION_NAME="4.6.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

          if [[ -n "${SIGNING_KEYSTORE_BASE64}" ]]; then
            KS_FILE="${RUNNER_TEMP}/earwax.p12"
            echo "${SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${KS_FILE}"
            echo "EARWAX_KEYSTORE=${KS_FILE}" >> "$GITHUB_ENV"
            echo "EARWAX_STORE_PASS=${SIGNING_STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "EARWAX_KEY_ALIAS=${SIGNING_KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "EARWAX_KEY_PASS=${SIGNING_KEY_PASSWORD}" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        run: gradle --no-daemon assembleRelease -PversionCode="${VERSION_CODE}" -PversionName="${VERSION_NAME}"
      - name: Prepare release assets
        run: |
          mv app/build/outputs/apk/release/*.apk earwax.apk
          cat > version.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "tag": "${RELEASE_TAG}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/earwax.apk"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: earwax-apk
          path: earwax.apk
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: EARWAX ${{ env.RELEASE_TAG }}
          make_latest: true
          body: |
            versionCode=${{ env.VERSION_CODE }}
            versionName=${{ env.VERSION_NAME }}
            Commit: ${{ github.sha }}
          files: |
            earwax.apk
            version.json
      - name: Clean up keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/earwax.p12"
