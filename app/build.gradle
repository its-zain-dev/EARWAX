plugins { id 'com.android.application' }

android {
    namespace 'app.earwax'
    compileSdk 34
    def vcProp = project.findProperty('versionCode')
    def vnProp = project.findProperty('versionName')
    defaultConfig {
        applicationId 'app.earwax'
        minSdk 26
        targetSdk 34
        resourceConfigurations += ['en', 'ar']
        versionCode vcProp ? vcProp.toInteger() : 6
        versionName vnProp ? vnProp.toString() : '4.6'
    }
    signingConfigs {
        release {
            def ksPath = System.getenv('EARWAX_KEYSTORE')
            if (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()) {
                storeFile file(ksPath)
                storeType 'PKCS12'
                storePassword System.getenv('EARWAX_STORE_PASS')
                keyAlias System.getenv('EARWAX_KEY_ALIAS')
                keyPassword System.getenv('EARWAX_KEY_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def ksPath = System.getenv('EARWAX_KEYSTORE')
            signingConfig (ksPath != null && !ksPath.isEmpty() && file(ksPath).exists())
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'DebugProbesKt.bin', 'kotlin-tooling-metadata.json', 'META-INF/*.version']
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.core:core:1.13.1'
}
